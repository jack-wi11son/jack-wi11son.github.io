# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.

# Main Page Setup

title: Jack Willson's Portfolio # This is what shows up in the tab of the browser



# Hero Section
name: Jack Willson
headline: Mechatonics Engineer
description: >- # dont remove this line. this will ignore all new lines until the next section
  First Class Honours Mechatronics Engineer specializing in embedded systems, EV control, and industrial automation. 
  Proven track record in real-time firmware, PCB design, and vehicle dynamics from winning the Formula SAE Australasia EV category. 
  Experienced in bridging the gap between hands-on mechanical machining and robust, multi-layered software deployment.


# Place your profile image in /assets/images/profile-image/folder and edit the file name
profile_image: ./assets/images/profile-image/profile-pic.jpg


# Link your resume
# You can place your resume in assets/resume/{resume.pdf or add external link such as pdf saved in google drive 
resume-url: /assets/resume/JACK_CV_GRAD.pdf


# Set up external links - this will show up as small icons next to your name.

external-links:    # input only your own url slug. The icons with missing entries will not appear.
  linkedin: jack--willson    # https://www.linkedin.com/in/{your url slug} 
  github: jack-wi11son    # https://github.com/{your url slug} 
  stackoverflow:       # https://stackoverflow.com/users/{your url slug}
  medium:            # https://medium.com/@{your url slug} 
  x-twitter:   # https://x.com/{your url slug} 
  threads:            # https://threads.net/@{your url slug} 
  instragram:       # https://instagram.com/{your url slug} 
  youtube:           # https://youtube.com/@{your url slug} 
  discord:            # https://discord.com/users/{your url slug} 
  bluesky:           # https://bsky.app/profile/{your url slug} 
  

# Skills Section - Add the list of your Skills by categories/tools. The indentation for each level needs to be precise. 
skills:
  - category: 3D Modeling
    tools:
    - Solidworks
    - Onshape
    - Fusion 360 (Autodesk)
  - category: Prototyping & Manufacturing
    tools:
    - CNC Machining
    - FDM (3D Printing)
    - Laser & Water Jet Cutting
    - Arduino / Raspberry Pi
    - Breadboarding & Circuit Testing
  - category: PCB / Electrical Design
    tools:
    - Altium Designer
    - KiCad
    - LTspice
  - category: Problem Solving / Risk Management
    tools:
    - Fault Tree Analysis
    - FMEA / FMECA (Failure Mode and Effects Analysis)
    - Hardware-Software Co-Validation
    - Structured Unit Testing
  - category: Embedded Systems & Control
    tools:
    - PID Control
    - CAN Bus / CAN DBC
    - ARM MCUs (Microchip SAM4S)
    - Teensy (Cortex-M7) & Tiva LaunchPad
    - ESP-IDF
  - category: Industrial Automation
    tools:
    - CODESYS (IEC 61131-3)
    - Ladder Logic & Structured Text
    - IO-Link Systems
    - Industrial Fieldbuses (Modbus / EtherCAT / Ethernet-IP)
    - PLCs & HMI Development
  - category: Programming & Software
    tools:
    - C / C++
    - Python
    - VHDL
    - Git / Version Control
    - CI/CD Workflows
    - Linux Server Administration
  - category: Motorsport & Automotive Tools
    tools:
    - MoTeC M1 Build / Tune
    - MoTeC i2 Data Analysis
    - Link PDM / PDMLink
    - Wiring & Harness Loom Manufacture
    - Vehicle Dynamics & Torque Vectoring



